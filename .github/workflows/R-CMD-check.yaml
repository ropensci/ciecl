# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, dev]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    # Timeout por job: evita cuelgues de infra (ej. apt-get update colgado
    # el 18-08-2026, que GitHub cancelo recien a las 6h por defecto).
    timeout-minutes: 30

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}
          - {os: ubuntu-latest,   r: 'oldrel-2'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # Workaround: el binario P3M de stringdist para macOS requiere libomp,
      # ausente en el R de CRAN del runner (OpenMP deshabilitado). Se fuerza
      # compilar desde fuente. Retirar este step y la variable cuando P3M
      # publique un binario compatible con el toolchain CRAN macOS.
      - name: Force stringdist from source on macOS
        if: runner.os == 'macOS'
        run: echo "MAC_SOURCE_PKGS=stringdist?source" >> $GITHUB_ENV
        shell: bash

      # Mantener any::rcmdcheck en la primera línea: setup-r-dependencies
      # parsea extra-packages con strsplit y una línea inicial vacía rompería
      # la resolución en Windows/Linux (donde MAC_SOURCE_PKGS está vacía).
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            ${{ env.MAC_SOURCE_PKGS }}
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
